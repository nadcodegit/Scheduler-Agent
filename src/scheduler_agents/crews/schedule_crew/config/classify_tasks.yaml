classify_email:
  description: >
    Classify the incoming email using the subject, sender, body, and attachment
    names.

    Email:
    {email}

    Label definitions -- read carefully, "availability" is used in two
    different senses in real scheduler emails:

    - schedule: the scheduler is proactively sending a finalized table/list
      of upcoming interpretation sessions -- a genuine roster/rota
      announcement, not a reply. Vendors often call this a "roster" or
      "rota" instead of "schedule" -- treat those as the same thing. The
      actual slot data may be in an attached table/image rather than the
      email text; classify as schedule regardless of whether the body
      itself contains parseable dates. A short reply-thread message about
      the status of ONE shift the interpreter already knows about
      (cancelled, reinstated, reassigned, confirmed) is NOT this -- see the
      "other" examples below, especially the last one.
    - coverage_request: the scheduler has open/extra hours and is asking the
      interpreter to pick them up -- including phrasing like "we have
      availability from X-Y, can you stay logged in longer / take additional
      hours / cover this". The scheduler is OFFERING time here, even though
      the word "availability" appears.
    - availability_request: the scheduler is asking the interpreter to STATE
      their own availability for an upcoming period (e.g. "please send your
      availability for next month"). The interpreter's schedule is what's
      being asked about, not offered.
    - timesheet: monthly hours/payment TOTALS to be confirmed or filled in --
      including "Purchase Order" notifications, even when the email body
      itself is generic ("please find attached the Purchase Order..."); the
      actual hours/amount data lives in the PDF attachment, not the body.
      A schedule/roster email mentioning "hours" in the time-of-day sense
      (e.g. "do not log in during these hours") is NOT a timesheet --
      only classify as timesheet when hours means a worked-hours total or
      payment calculation.
    - other: anything that doesn't fit the above. This includes emails that
      MENTION a date or time range without actually being a schedule --
      the presence of a date/time alone is not evidence of "schedule".
      Concretely, classify as other (not schedule):
        * Attendance/performance feedback about a shift that already
          happened (e.g. "you were absent for your 8am-9am slot on
          Monday, why did you log in late?") -- this is feedback about
          the past, not a new roster to log into.
        * Compliance/administrative reminders with a deadline (e.g.
          "please renew your Criminal Background Check / Residence
          Permit by August 31" or any document/certification expiry
          notice) -- the date here is a submission deadline, not an
          interpretation time slot.
        * A confirmation that an existing shift is being REMOVED/
          cancelled from the roster (e.g. replying to the interpreter's
          own emergency/unavailability notice with "OK, I've removed
          your 10am-12pm shift on August 20, no action needed"). The
          date here describes a slot being taken away, not one to add
          -- and this system has no delete/cancel workflow at all, so
          there is nothing to do with it either way.
        * A short reply confirming a PREVIOUSLY-cancelled shift is back
          on, or reassigned, or otherwise just confirming status on ONE
          shift the interpreter already knows about -- even when it has
          no date/time in it at all (e.g. "Okay, I will assign you your
          originally scheduled shift back. Thank you."). This is easy to
          mis-read as a genuine new assignment because the wording sounds
          similar, but it's status confirmation in an ongoing reply
          thread about a shift that's already on the roster, not a new
          schedule being sent. The giveaway: it's a short reply
          ("Re: ..." subject, one or two sentences), not a proactive
          table/list of sessions.
      The test that actually matters: would logging this email's dates as
      NEW calendar events be useful or nonsensical? A genuine schedule
      email announces slots the interpreter should show up for; none of
      these four examples do -- they reference a shift for an unrelated
      reason (past feedback, an administrative deadline, a removal, a
      status confirmation), not to add anything to the calendar.

    Return one label only:
    schedule, coverage_request, availability_request, timesheet, or other.
  expected_output: >
    A single lowercase label: schedule, coverage_request, availability_request,
    timesheet, or other.
  agent: inbox_intelligence_agent
