classify_email:
  description: >
    Classify the incoming email using the subject, sender, body, and attachment
    names.

    Email:
    {email}

    Label definitions -- read carefully, "availability" is used in two
    different senses in real scheduler emails:

    - schedule: the scheduler is sending a finalized table/list of upcoming
      interpretation sessions.
    - coverage_request: the scheduler has open/extra hours and is asking the
      interpreter to pick them up -- including phrasing like "we have
      availability from X-Y, can you stay logged in longer / take additional
      hours / cover this". The scheduler is OFFERING time here, even though
      the word "availability" appears.
    - availability_request: the scheduler is asking the interpreter to STATE
      their own availability for an upcoming period (e.g. "please send your
      availability for next month"). The interpreter's schedule is what's
      being asked about, not offered.
    - timesheet: monthly hours/payment totals to be confirmed or filled in.
    - other: anything that doesn't fit the above.

    Return one label only:
    schedule, coverage_request, availability_request, timesheet, or other.
  expected_output: >
    A single lowercase label: schedule, coverage_request, availability_request,
    timesheet, or other.
  agent: inbox_intelligence_agent

extract_schedule:
  description: >
    Extract all interpretation schedule rows from this email.

    Email:
    {email}

    Return strict JSON records with date, start_time, end_time, language, title,
    and source. Use ISO date format YYYY-MM-DD and 24-hour HH:MM times.
  expected_output: >
    A JSON array of schedule event objects. Each object must include date,
    start_time, end_time, language, title, and source.
  agent: schedule_parser_agent
  async_execution: true

validate_schedule:
  description: >
    Validate the schedule records extracted by the previous task. Check for
    missing required fields, invalid time ranges, duplicate events,
    unsupported languages, and anything that should require human approval.
  expected_output: >
    A JSON object with fields: valid, errors, approval_required, and summary.
  agent: schedule_validator_agent
  context:
    - extract_schedule

