[project]
name = "scheduler-agents"
version = "0.1.0"
description = "CrewAI scheduler automation project for interpreter schedules."
requires-python = ">=3.11"
dependencies = [
    "crewai[google-genai,litellm]>=0.100.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

